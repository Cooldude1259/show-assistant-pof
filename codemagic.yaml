workflows:
  ios-unsigned:
    name: iOS unsigned IPA (sign later with plumesign)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      vars:
        # The bundle ID. Change it here and nowhere else.
        BUNDLE_ID: com.cooldude12.showassistant
    scripts:
      - name: Generate iOS project if it isn't committed yet
        script: |
          if [ ! -d ios ]; then
            flutter create --platforms ios --org com.cooldude12 --project-name show_assistant .
          fi
      - name: Set bundle ID
        script: |
          # flutter create names the app <org>.showAssistant; swap in BUNDLE_ID.
          # Only matches the main target (the test target ends in .RunnerTests).
          sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*showAssistant;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" ios/Runner.xcodeproj/project.pbxproj
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj
      - name: Build unsigned IPA
        script: |
          flutter pub get
          flutter build ios --release --no-codesign
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ShowAssistant.ipa Payload
    artifacts:
      - ShowAssistant.ipa
