workflows:
  ios-unsigned:
    name: iOS unsigned IPA (sign later with plumesign / Impactor)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      # The committed ios/ folder is the single source of truth: bundle ID,
      # display name, permissions and Info.plist all live there. This step
      # only checks it, so a broken or missing ios/ fails fast instead of
      # quietly building something with the wrong ID.
      - name: Check ios project
        script: |
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then
            echo "ios/ folder is missing. Commit it from your PC first."
            exit 1
          fi
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.cooldude12.showassistant;" ios/Runner.xcodeproj/project.pbxproj \
            || { echo "Bundle ID in ios/ is not com.cooldude12.showassistant"; exit 1; }
      - name: Build unsigned IPA
        script: |
          flutter pub get
          flutter build ios --release --no-codesign
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ShowAssistant.ipa Payload
    artifacts:
      - ShowAssistant.ipa
